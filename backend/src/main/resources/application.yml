server:
  port: ${PORT:8080}

spring:
  application:
    name: smart-emergency-queue
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Educational disclaimer banner
app:
  disclaimer: "EDUCATIONAL SIMULATION ONLY: This software demonstrates Java data structures (PriorityQueue, FIFO Queue, HashMap) for queue scheduling. It must NEVER be used for clinical triage or real medical decision-making."
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  queue:
    treatment-capacity: ${TREATMENT_CAPACITY:1}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Management & Health Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:emergencydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/emergencydb}}
    driverClassName: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
