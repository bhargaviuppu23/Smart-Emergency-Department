services:
  # Managed PostgreSQL Database
  - type: postgres
    name: emergency-queue-db
    plan: free
    databaseName: emergencydb
    user: emergency_admin

  # Spring Boot Backend Web Service
  - type: web
    name: smart-emergency-queue-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: emergency-queue-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-emergency-queue-frontend.vercel.app,http://localhost:5173

  # Frontend Static Site
  - type: static
    name: smart-emergency-queue-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smart-emergency-queue-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
